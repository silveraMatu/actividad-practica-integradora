services:
  mongo:
    image: mongo:latest
    container_name: mongodb
    restart: always
    env_file:
      - ./backend/.env
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongodb://admin:admin@localhost:27017/?authSource=admin --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${env.MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${env.MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${env.MONGO_DB_NAME}
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://admin:admin@mongo:27017
      MONGO_DB_NAME: ${env.MONGO_DB_NAME}
      MONGO_USER: ${env.MONGO_USER}
      MONGO_PASSWORD: ${env.MONGO_PASSWORD}
      SECRET: ${env.SECRET}
      SALT: ${env.SALT}
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo-data:   